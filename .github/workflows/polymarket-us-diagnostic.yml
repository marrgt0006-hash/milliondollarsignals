name: Polymarket US API Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify diagnostic YAML syntax
        run: ruby -e 'require "yaml"; YAML.load_file(".github/workflows/polymarket-us-diagnostic.yml"); puts "Workflow YAML parsed successfully"'
      - name: Run redaction and candidate-extraction tests
        run: python -m unittest discover -s tests -p 'test_polymarket_us_diagnostic.py' -v
      - name: Run public API diagnostic
        run: |
          mkdir -p diagnostics/latest
          python scripts/polymarket_us_diagnostic.py
      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-us-api-diagnostic
          path: diagnostics/latest/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit diagnostic findings
        if: always() && hashFiles('diagnostics/latest/polymarket-us-diagnostic.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/latest/
          if git diff --cached --quiet; then
            echo "No diagnostic changes to commit."
          else
            git commit -m "Record Polymarket US API diagnostic results"
            git push
          fi
