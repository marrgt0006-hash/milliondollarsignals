name: Polymarket US API Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run public API diagnostic
        shell: bash
        run: |
          mkdir -p diagnostics/latest
          python <<'PY'
          import datetime as dt, json, socket, ssl, time, urllib.error, urllib.parse, urllib.request
          from pathlib import Path

          host = "gateway.polymarket.us"
          base = "https://" + host
          secret_keys = ("authorization", "cookie", "secret", "token", "apikey", "api_key", "password", "private_key", "session", "email", "phone", "address")
          def clean(x):
              if isinstance(x, dict):
                  return {str(k): ("[REDACTED]" if any(s in str(k).lower().replace("-", "_") for s in secret_keys) else clean(v)) for k, v in x.items()}
              if isinstance(x, list): return [clean(v) for v in x]
              if isinstance(x, str): return x[:20000]
              return x
          def body(raw):
              try: return clean(json.loads(raw.decode("utf-8", "replace")))
              except Exception: return {"non_json_body": raw.decode("utf-8", "replace")[:20000]}
          t = time.perf_counter()
          try:
              dns_rows = socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)
              dns = {"classification":"DNS_SUCCESS","addresses":sorted({r[4][0] for r in dns_rows}),"elapsed_ms":round((time.perf_counter()-t)*1000,2)}
          except socket.gaierror as e:
              dns = {"classification":"DNS_FAILURE","error":type(e).__name__+": "+str(e),"elapsed_ms":round((time.perf_counter()-t)*1000,2)}

          specs = [
              ("markets","/v1/markets",{"limit":100,"offset":0,"active":"true","closed":"false","archived":"false","includeHidden":"true"}),
              ("events","/v1/events",{"limit":100,"offset":0,"active":"true","closed":"false","archived":"false","includeHidden":"true"}),
              ("series","/v1/series",{"limit":100,"offset":0}),
              ("search","/v1/search",{"query":"BTC","limit":100,"page":1,"status":"active"}),
          ]
          results=[]
          for name,path,params in specs:
              url=base+path+"?"+urllib.parse.urlencode(params)
              started=time.perf_counter()
              r={"name":name,"url":url,"http_status":None,"classification":None,"response_time_ms":None,"content_type":None,"response_body":None,"error":None}
              req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"Polybot-ReadOnly-Diagnostic/1.0"})
              try:
                  with urllib.request.urlopen(req,timeout=20) as resp:
                      raw=resp.read(750001); truncated=len(raw)>750000; raw=raw[:750000]
                      r.update(http_status=resp.status,content_type=resp.headers.get("Content-Type"),response_body=body(raw),body_truncated=truncated)
                      r["classification"]="EMPTY_SUCCESS" if not raw else "SUCCESSFUL_RESPONSE"
              except urllib.error.HTTPError as e:
                  raw=e.read(750001)
                  r.update(http_status=e.code,content_type=e.headers.get("Content-Type") if e.headers else None,response_body=body(raw[:750000]),body_truncated=len(raw)>750000,classification="HTTP_ERROR",error=str(e.reason))
              except urllib.error.URLError as e:
                  reason=e.reason
                  if isinstance(reason,socket.gaierror): kind="DNS_FAILURE"
                  elif isinstance(reason,ssl.SSLError): kind="TLS_FAILURE"
                  else: kind="CONNECTION_FAILURE"
                  r.update(classification=kind,error=type(reason).__name__+": "+str(reason))
              except ssl.SSLError as e: r.update(classification="TLS_FAILURE",error=type(e).__name__+": "+str(e))
              except (ConnectionError,TimeoutError,OSError) as e: r.update(classification="CONNECTION_FAILURE",error=type(e).__name__+": "+str(e))
              except Exception as e: r.update(classification="CLIENT_ERROR",error=type(e).__name__+": "+str(e))
              r["response_time_ms"]=round((time.perf_counter()-started)*1000,2)
              results.append(r)

          def walk(v):
              if isinstance(v,dict):
                  yield v
                  for z in v.values(): yield from walk(z)
              elif isinstance(v,list):
                  for z in v: yield from walk(z)
          candidates=[]; seen=set()
          for r in results:
              if r["http_status"] is None or not 200 <= r["http_status"] < 300: continue
              for obj in walk(r["response_body"]):
                  s=json.dumps(obj,ensure_ascii=False).lower()
                  if ("btc" in s or "bitcoin" in s) and ("up_down" in s or "updown" in s or ("up" in s and "down" in s)) and ("5m" in s or "5-minute" in s or "5 minute" in s):
                      key=json.dumps(obj,sort_keys=True,ensure_ascii=False)
                      if key in seen: continue
                      seen.add(key)
                      terms=obj.get("assetPriceTerms") if isinstance(obj.get("assetPriceTerms"),dict) else {}
                      asset=terms.get("asset") if isinstance(terms.get("asset"),dict) else {}
                      start=terms.get("windowStart") or terms.get("windowStartTime")
                      end=terms.get("windowEnd") or terms.get("windowEndTime")
                      duration=None
                      try:
                          a=dt.datetime.fromisoformat(str(start).replace("Z","+00:00"))
                          b=dt.datetime.fromisoformat(str(end).replace("Z","+00:00"))
                          duration=(b-a).total_seconds()
                      except Exception: pass
                      candidates.append({"source":r["name"],"id":obj.get("id"),"slug":obj.get("slug"),"question":obj.get("question"),"asset_class":asset.get("assetClass"),"asset_symbol":asset.get("symbol"),"market_type":terms.get("marketType") or obj.get("marketType"),"horizon":terms.get("horizon"),"index_symbol":terms.get("indexSymbol"),"window_start":start,"window_end":end,"computed_duration_seconds":duration,"direction":terms.get("direction"),"market_sides":obj.get("marketSides"),"outcomes":obj.get("outcomes"),"fee_coefficient":obj.get("feeCoefficient"),"status":obj.get("status"),"active":obj.get("active"),"closed":obj.get("closed"),"raw_candidate":obj})
          for r in results:
              if r["classification"]=="SUCCESSFUL_RESPONSE":
                  r["classification"]="SUCCESSFUL_RESPONSE_WITH_MATCH" if candidates else "SUCCESSFUL_RESPONSE_NO_MATCH"
          generated=dt.datetime.now(dt.timezone.utc).isoformat()
          report={"generated_at_utc":generated,"runner":"GitHub-hosted ubuntu-latest","host":host,"scope":"Public unauthenticated GET only; no account/order/trading/private endpoints","dns":dns,"endpoints":results,"candidate_count":len(candidates),"candidates":candidates,"verification_note":"Discovery candidates are not verified. Require explicit BTC crypto asset, UP/DOWN family, 5m horizon, exact 300-second timestamps, BRTI settlement rules, opening/closing timestamps, explicit outcome/token mapping, and market-specific feeCoefficient. Missing fields remain null; do not infer."}
          Path("diagnostics/latest/polymarket-us-diagnostic.json").write_text(json.dumps(report,indent=2,ensure_ascii=False)+"\n")
          lines=["# Polymarket US API Diagnostic","",f"- Generated UTC: {generated}",f"- DNS: {dns['classification']}","","| Endpoint | Classification | HTTP | Response time (ms) |","|---|---|---:|---:|"]
          for r in results: lines.append(f"| {r['name']} | {r['classification']} | {r['http_status'] if r['http_status'] is not None else '—'} | {r['response_time_ms']} |")
          lines += ["",f"BTC UP/DOWN 5-minute discovery candidates: {len(candidates)}.","","See JSON for sanitized response bodies and explicit candidate fields. A textual match is not proof of market eligibility or settlement terms."]
          Path("diagnostics/latest/README.md").write_text("\n".join(lines)+"\n")
          print(json.dumps({"dns":dns,"endpoints":[{k:r[k] for k in ("name","classification","http_status","response_time_ms")} for r in results],"candidate_count":len(candidates)},indent=2))
          PY
      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-us-api-diagnostic
          path: diagnostics/latest/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit diagnostic findings
        if: always() && hashFiles('diagnostics/latest/polymarket-us-diagnostic.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/latest/
          if git diff --cached --quiet; then
            echo "No diagnostic changes to commit."
          else
            git commit -m "Record Polymarket US API diagnostic results"
            git push
          fi
